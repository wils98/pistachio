[project]
name = "pistachio"
version = "0.1.0"
description = "OOTP scouting-rating projection system (wOBA/WAR), customized for the PSD league"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "jinja2>=3.1",
]

# Only needed for calibration/ (one-off, human-run regression fitting against real PSD data —
# see calibration/README.md) — never installed on the deployed box's plain `uv sync`.
[project.optional-dependencies]
calibration = [
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

# Flat top-level modules (main.py, config.py, ...), not an installable package —
# uv just needs to manage the dependency venv, not build/install this project itself.
[tool.uv]
package = false
